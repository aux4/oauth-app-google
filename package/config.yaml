# aux4/api route map for the Google OAuth plugin.
#
# This plugin OWNS its /google/* routes. The core aux4/oauth-app provides the
# shared api/oauth machinery and the /health route — do NOT redefine it here.
#
# Deployed together with the core as an aux4.cloud api-type machine. Each
# "METHOD /path" maps to an aux4 command. The api runtime passes the request
# context to the command as flags:
#   --query  '{"redirectUri":"..."}'   (query string)
#   --body   '{"code":"..."}'          (JSON body)
# so the commands read ${query.x} / ${body.x} — NOT shell ${...}.
# Routes are served under the /api prefix (e.g. GET <machine-url>/api/google/authorize-url).
config:
  api:
    # Gated by default (secure mode): requires a same-scope aux4 idToken.
    "GET /google/authorize-url":
      command: aux4 oauth-app google authorize-url
    # Redirect landing point for Google. Register <machine-url>/api/google/callback
    # as the redirect URI on the Google app. Delegates to the shared core handler,
    # which parks the code by session id for the polling CLI. PUBLIC: the provider's
    # browser redirect carries no aux4 token, and the parked code is useless without
    # the client's PKCE verifier.
    "GET /google/callback":
      command: aux4 oauth-app callback
      public: true
    # Gated by default (secure mode): requires a same-scope aux4 idToken.
    "POST /google/exchange":
      command: aux4 oauth-app google exchange
    # PUBLIC: the refresh token is itself the credential, so refresh stays open —
    # but rate-limited to blunt brute-force / abuse.
    "POST /google/refresh":
      command: aux4 oauth-app google refresh
      public: true
      rateLimit:
        max: 10
        timeWindow: 60000
